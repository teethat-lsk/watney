name: CI

# One job per component, each running the same `make <component>-check` as a developer does locally.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (migrations, hooks, staff login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make backend-check

  web:
    name: web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-setup
      - run: make web-check

  mobile:
    name: mobile (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: make mobile-setup
      - run: make mobile-check
